name: Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    # 周一 10:23（Asia/Shanghai），避开整点。
    - cron: '23 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify security guard failure modes
        run: python3 -m unittest discover -s scripts/ci -p 'test_security_*.py'
      - name: Initialize CodeQL
        uses: github/codeql-action/init@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - name: Analyze
        uses: github/codeql-action/analyze@793b778da9c9275a0f276522b27cb5fc14bba279 # v4
        with:
          output: codeql-results
          category: /language:javascript-typescript

      - name: Enforce CodeQL high severity gate
        run: python3 scripts/ci/check_sarif.py codeql-results
      - name: Preserve CodeQL evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: codeql-reports
          path: codeql-results/
          retention-days: 14

  dependencies:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TRIVY_INCLUDE_DEV_DEPS: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Scan dependencies including development dependencies
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.1
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: dependency-vulnerabilities.json
          list-all-pkgs: true
          timeout: 15m
          skip-dirs: node_modules,dist,.git
      - name: Require a nonempty dependency inventory
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("dependency-vulnerabilities.json").read_text())
          results = report.get("Results", [])
          packages = sum(len(result.get("Packages", [])) for result in results)
          if not packages:
              raise SystemExit("No packages scanned; dependency scan is incomplete")
          print(f"Scanned packages: {packages}")
          PY
      - name: Upload dependency inventory and vulnerability report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: dependency-security-reports
          path: |
            dependency-vulnerabilities.json
          retention-days: 14


  image:
    name: Docker Image Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Build application for image scanning
        run: |
          npm ci
          npm run build
      - name: Build local image without publishing
        id: image
        run: python3 scripts/ci/build_image.py frontend
      - name: Scan OS and application dependencies in local image
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8 # v0.36.0
        with:
          version: v0.76.1
          scan-type: image
          image-ref: ${{ steps.image.outputs.image_id }}
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
          format: json
          output: image-vulnerabilities.json
          list-all-pkgs: true
          timeout: 15m
      - name: Require a nonempty image inventory
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("image-vulnerabilities.json").read_text())
          packages = sum(len(result.get("Packages", [])) for result in report.get("Results", []))
          if not packages:
              raise SystemExit("No packages scanned; image scan is incomplete")
          print(f"Scanned image packages: {packages}")
          PY
      - name: Upload image vulnerability evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: image-security-reports
          path: image-vulnerabilities.json
          retention-days: 14
